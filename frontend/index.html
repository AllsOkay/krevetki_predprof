<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <span style="margin-right: 8px;">🦐</span>
            Alien Classifier
        </a>
        <div class="nav-links">
            <span class="status-badge status-success">
                <i class="fas fa-circle" style="font-size: 8px;"></i>
                Система активна
            </span>
        </div>
    </nav>

    <main class="container">
        <div class="login-container">
            <div class="login-card animate-fade-in">
                <div class="login-header">
                    <h1>Вход в систему</h1>
                    <p>Классификация инопланетных радиосигналов</p>
                </div>

                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i> Логин
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Введите ваш логин"
                            required
                            autocomplete="off"
                            autofocus
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Пароль
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Введите ваш пароль"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" id="passwordToggle" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div id="loginError" class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="errorText"></span>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Войти в систему
                    </button>
                </form>

                <div class="demo-credentials">
                    <h4><i class="fas fa-info-circle"></i> Демо-доступ для тестирования:</h4>
                    <div class="credential-item">
                        <strong>Администратор:</strong><br>
                        Логин: <code>admin</code> | Пароль: <code>admin123</code>
                    </div>
                    <div class="credential-item">
                        <strong>Пользователь:</strong><br>
                        Логин: <code>user</code> | Пароль: <code>user123</code>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
