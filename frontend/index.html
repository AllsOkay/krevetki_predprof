<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦐 Pokémon AI Search</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div class="container">
        
        <!-- Header -->
        <header class="header">
            <h1>🦐 Pokémon AI</h1>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span id="status-text">Подключение...</span>
            </div>
        </header>

        <!-- Main Controls -->
        <section class="controls">
            <button id="add-all-btn" class="btn btn-primary">➕ Добавить всех</button>
            <button id="train-cnn-btn" class="btn btn-secondary">🎓 CNN</button>
            <button id="train-rnn-btn" class="btn btn-secondary">🧠 RNN</button>
            <button id="train-ae-btn" class="btn btn-secondary">🔄 AE</button>
            <button id="train-mlp-btn" class="btn btn-secondary">⚔️ MLP</button>
            <button id="clear-btn" class="btn btn-danger">🗑️</button>
        </section>

        <!-- Progress Bar -->
        <div class="progress hidden" id="progress">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <span id="progress-text">0%</span>
        </div>

        <!-- CNN Section -->
        <section class="card">
            <h2>🖼️ Визуальный поиск</h2>
            <div class="input-group">
                <input type="text" id="cnn-input" placeholder="Имя покемона..." list="pokemon-suggestions">
                <button id="cnn-search-btn" class="btn btn-primary">🔍</button>
            </div>
            <div id="cnn-loading" class="loading hidden">⏳</div>
            <div id="cnn-results" class="results hidden"></div>
        </section>

        <!-- RNN Section -->
        <section class="card">
            <h2>🧠 Сила покемона</h2>
            <div class="input-group">
                <input type="text" id="rnn-input" placeholder="Имя покемона..." list="pokemon-suggestions">
                <button id="rnn-classify-btn" class="btn btn-primary">🔮</button>
            </div>
            <div id="rnn-loading" class="loading hidden">⏳</div>
            <div id="rnn-results" class="results hidden"></div>
        </section>

        <!-- Autoencoder Section -->
        <section class="card">
            <h2>🔄 Обычность</h2>
            <div class="input-group">
                <input type="text" id="ae-input" placeholder="Имя покемона..." list="pokemon-suggestions">
                <button id="ae-check-btn" class="btn btn-primary">📊</button>
            </div>
            <div id="ae-loading" class="loading hidden">⏳</div>
            <div id="ae-results" class="results hidden"></div>
        </section>

        <!-- MLP Section -->
        <section class="card">
            <h2>⚔️ Вероятность победы</h2>
            <div class="input-group">
                <input type="number" id="mlp-hp" placeholder="HP" min="0">
                <input type="number" id="mlp-atk" placeholder="ATK" min="0">
                <input type="number" id="mlp-def" placeholder="DEF" min="0">
                <input type="number" id="mlp-spd" placeholder="SPD" min="0">
            </div>
            <button id="mlp-predict-btn" class="btn btn-primary full-width">Рассчитать</button>
            <div id="mlp-loading" class="loading hidden">⏳</div>
            <div id="mlp-results" class="results hidden"></div>
        </section>

        <!-- Training Graph Section -->
        <section class="card" id="graph-section">
            <h2>📈 График обучения</h2>
            <div class="graph-controls">
                <select id="graph-model-select">
                    <option value="cnn">CNN</option>
                    <option value="rnn">RNN</option>
                    <option value="autoencoder">Autoencoder</option>
                    <option value="mlp">MLP</option>
                </select>
                <button id="view-2d-btn" class="btn btn-small active">2D</button>
                <button id="view-3d-btn" class="btn btn-small">3D</button>
                <button id="refresh-graph-btn" class="btn btn-small">🔄</button>
            </div>
            <div id="graph-loading" class="loading hidden">⏳</div>
            <div id="graph-2d-container" class="graph-container">
                <canvas id="training-chart-2d"></canvas>
            </div>
            <div id="graph-3d-container" class="graph-container hidden">
                <div id="training-chart-3d"></div>
            </div>
            <div id="graph-stats" class="stats"></div>
        </section>

        <!-- Pokemon Table -->
        <section class="card">
            <h2>📋 База (<span id="db-count">0</span>)</h2>
            <button id="refresh-btn" class="btn btn-small">🔄</button>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr><th>ID</th><th>Имя</th><th>Тип</th><th>HP</th><th>ATK</th><th>DEF</th><th>SPD</th></tr>
                    </thead>
                    <tbody id="pokemon-table-body"></tbody>
                </table>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>🦐 Pokémon AI Search</p>
        </footer>

    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</body>
</html>
